/* =====================================================
   FUNCIONES GENERALES
===================================================== */

function euro(value){

if(!isFinite(value)) return "—";

return new Intl.NumberFormat("es-ES",{
style:"currency",
currency:"EUR",
maximumFractionDigits:0
}).format(value);

}

function euro2(value){

if(!isFinite(value)) return "—";

return new Intl.NumberFormat("es-ES",{
style:"currency",
currency:"EUR",
maximumFractionDigits:2
}).format(value);

}

function pct(value){

if(!isFinite(value)) return "—";

return new Intl.NumberFormat("es-ES",{
maximumFractionDigits:1
}).format(value)+"%";

}

function num(id){

return Number(document.getElementById(id).value) || 0;

}


/* =====================================================
   CUOTA HIPOTECA
===================================================== */

function mortgagePayment(principal,annualRate,years){

const months=years*12;

if(principal<=0) return 0;

const monthlyRate=annualRate/100/12;

if(monthlyRate===0){

return principal/months;

}

return principal*
monthlyRate*
Math.pow(1+monthlyRate,months)/
(Math.pow(1+monthlyRate,months)-1);

}


/* =====================================================
   CALCULADORA HIPOTECA
===================================================== */

function calculateMortgage(){

const price=num("housePrice");
const savings=num("savings");
const financingPercent=num("financingPercent");
const costsPercent=num("purchaseCosts");
const annualInterest=num("interest");
const years=num("years");

if(price<=0 || financingPercent<=0 || years<=0){

alert("Introduce valores válidos.");

return;

}

const loan=price*financingPercent/100;

const downPayment=price-loan;

const purchaseCosts=price*costsPercent/100;

const initialMoney=downPayment+purchaseCosts;

const monthly=mortgagePayment(
loan,
annualInterest,
years
);

const totalBank=monthly*years*12;

const totalInterest=Math.max(
0,
totalBank-loan
);

const savingsDifference=savings-initialMoney;

document.getElementById("mortgagePayment").textContent=
euro(monthly)+"/mes";

document.getElementById("mortgageLoan").textContent=
euro(loan);

document.getElementById("mortgageDown").textContent=
euro(downPayment);

document.getElementById("mortgageCosts").textContent=
euro(purchaseCosts);

document.getElementById("mortgageInitial").textContent=
euro(initialMoney);

document.getElementById("mortgageInterest").textContent=
euro(totalInterest);

document.getElementById("mortgageTotal").textContent=
euro(totalBank);

document.getElementById("mortgageFinance").textContent=
pct(financingPercent);

if(savings>=initialMoney){

document.getElementById("mortgageSavingStatus").innerHTML=
'<div class="success"><strong>Tus ahorros cubrirían aproximadamente la entrada y los gastos indicados.</strong><br>Te quedarían '+euro(savingsDifference)+' después de esa aportación inicial.</div>';

}else{

document.getElementById("mortgageSavingStatus").innerHTML=
'<div class="warning"><strong>Tus ahorros no cubrirían toda la aportación inicial estimada.</strong><br>Te faltarían aproximadamente '+euro(Math.abs(savingsDifference))+' para cubrir entrada y gastos.</div>';

}

}


/* =====================================================
   CUANTO PUEDO PAGAR
===================================================== */

function calculateAffordability(){

const income=num("affIncome");
const maxRatio=num("affRatio");
const interest=num("affInterest");
const years=num("affYears");
const financing=num("affFinancing");
const savings=num("affSavings");
const costs=num("affCosts");

if(
income<=0 ||
maxRatio<=0 ||
years<=0 ||
financing<=0
){

alert("Introduce valores válidos.");

return;

}


/*
La cuota máxima se calcula a partir de ingresos.
No se confunde con los ahorros.
*/

const maximumMonthly=
income*maxRatio/100;

const maximumLoan=mortgagePrincipalFromPayment(
maximumMonthly,
interest,
years
);

const priceFromIncome=
maximumLoan/(financing/100);


/*
Ahora calculamos cuánto precio puede soportar
el ahorro disponible con el porcentaje financiado elegido.

Ahorros = entrada + gastos

entrada = precio * (1 - financiación)

gastos = precio * costes

por tanto:

ahorros = precio * ((1-financiación)+costes)
*/

const savingFactor=
(1-financing/100)+(costs/100);

let priceFromSavings=Infinity;

if(savingFactor>0){

priceFromSavings=
savings/savingFactor;

}

const theoreticalPrice=
Math.min(
priceFromIncome,
priceFromSavings
);

const loan=
theoreticalPrice*financing/100;

const down=
theoreticalPrice-loan;

const purchaseCosts=
theoreticalPrice*costs/100;

document.getElementById("affMaxPrice").textContent=
euro(theoreticalPrice);

document.getElementById("affMaxPayment").textContent=
euro(maximumMonthly)+"/mes";

document.getElementById("affMaxLoan").textContent=
euro(loan);

document.getElementById("affDown").textContent=
euro(down);

document.getElementById("affCosts").textContent=
euro(purchaseCosts);

document.getElementById("affIncomeLimit").textContent=
euro(priceFromIncome);

document.getElementById("affSavingLimit").textContent=
euro(priceFromSavings);

document.getElementById("affFinance").textContent=
pct(financing);

document.getElementById("affRatioResult").textContent=
pct(maxRatio);

}

function mortgagePrincipalFromPayment(
payment,
annualRate,
years
){

const months=years*12;

const monthlyRate=annualRate/100/12;

if(monthlyRate===0){

return payment*months;

}

return payment*
(
(Math.pow(1+monthlyRate,months)-1)/
(monthlyRate*Math.pow(1+monthlyRate,months))
);

}


/* =====================================================
   CUANTO NECESITO AHORRAR
===================================================== */

function calculateHouseSavings(){

const price=num("saveHousePrice");
const financing=num("saveFinancing");
const costs=num("saveCosts");
const current=num("saveCurrent");
const monthly=num("saveMonthly");

if(price<=0 || financing<=0 || monthly<=0){

alert("Introduce valores válidos.");

return;

}

const down=
price*(1-financing/100);

const costsAmount=
price*costs/100;

const required=
down+costsAmount;

const remaining=
Math.max(0,required-current);

const months=
Math.ceil(remaining/monthly);

const years=
Math.floor(months/12);

const rest=
months%12;

let time="";

if(years>0){

time+=years+(years===1?" año":" años");

}

if(rest>0){

if(time) time+=" y ";

time+=rest+(rest===1?" mes":" meses");

}

if(!time) time="Ya tienes el ahorro necesario";

document.getElementById("saveRequired").textContent=
euro(required);

document.getElementById("saveRemaining").textContent=
euro(remaining);

document.getElementById("saveTime").textContent=
time;

document.getElementById("saveDown").textContent=
euro(down);

document.getElementById("saveCostsResult").textContent=
euro(costsAmount);

}


/* =====================================================
   COMPRAR VS ALQUILAR
===================================================== */

function calculateBuyRent(){

const price=num("brPrice");
const financing=num("brFinancing");
const interest=num("brInterest");
const years=num("brYears");
const costs=num("brCosts");
const rent=num("brRent");
const rentIncrease=num("brRentIncrease");
const horizon=num("brHorizon");
const appreciation=num("brAppreciation");

if(
price<=0 ||
financing<=0 ||
years<=0 ||
rent<=0 ||
horizon<=0
){

alert("Introduce valores válidos.");

return;

}

const loan=
price*financing/100;

const down=
price-loan;

const purchaseCosts=
price*costs/100;

const initialPurchase=
down+purchaseCosts;

const monthlyMortgage=
mortgagePayment(
loan,
interest,
years
);

let totalRent=0;

let currentRent=rent;

for(let y=1;y<=horizon;y++){

totalRent+=currentRent*12;

currentRent*=(1+rentIncrease/100);

}

const totalMortgagePaid=
monthlyMortgage*
Math.min(horizon,years)*
12;

const totalPurchaseCash=
initialPurchase+
totalMortgagePaid;

const estimatedFutureValue=
price*Math.pow(
1+appreciation/100,
horizon
);

document.getElementById("brMortgage").textContent=
euro(monthlyMortgage)+"/mes";

document.getElementById("brInitial").textContent=
euro(initialPurchase);

document.getElementById("brRentTotal").textContent=
euro(totalRent);

document.getElementById("brBuyCash").textContent=
euro(totalPurchaseCash);

document.getElementById("brFutureValue").textContent=
euro(estimatedFutureValue);

const difference=
totalRent-totalPurchaseCash;

document.getElementById("brDifference").textContent=
euro(Math.abs(difference));

document.getElementById("brInterpretation").innerHTML=
'<div class="info"><strong>Lectura del cálculo:</strong> este resultado compara flujos de dinero simplificados. No incluye todos los posibles costes de mantenimiento, seguros, impuestos, oportunidad del capital, gastos de venta ni evolución real del mercado. No debe interpretarse como una predicción.</div>';

}


/* =====================================================
   COMPARADOR DE PRÉSTAMOS
===================================================== */

function calculateLoans(){

const amount=num("loanAmountCompare");

const loans=[
{
name:"Préstamo A",
rate:num("loanRateA"),
years:num("loanYearsA")
},
{
name:"Préstamo B",
rate:num("loanRateB"),
years:num("loanYearsB")
},
{
name:"Préstamo C",
rate:num("loanRateC"),
years:num("loanYearsC")
}
];

if(amount<=0){

alert("Introduce un importe válido.");

return;

}

let html="";

loans.forEach(loan=>{

if(loan.rate<0 || loan.years<=0) return;

const payment=
mortgagePayment(
amount,
loan.rate,
loan.years
);

const total=
payment*loan.years*12;

const interest=
total-amount;

html+=`
<tr>
<td>${loan.name}</td>
<td>${loan.rate.toFixed(2)}%</td>
<td>${loan.years} años</td>
<td class="highlight">${euro(payment)}/mes</td>
<td>${euro(interest)}</td>
<td>${euro(total)}</td>
</tr>
`;

});

document.getElementById("loanTableBody").innerHTML=html;

}


/* =====================================================
   BRUTO A NETO
===================================================== */

function calculateNetSalary(){

const gross=num("grossSalary");
const payments=num("salaryPayments");
const irpf=num("irpf");
const social=num("socialSecurity");

if(gross<=0 || payments<=0){

alert("Introduce valores válidos.");

return;

}

const annualGross=
gross*payments;

const annualIrpf=
annualGross*irpf/100;

const annualSocial=
annualGross*social/100;

const annualNet=
annualGross-
annualIrpf-
annualSocial;

const monthlyNet=
annualNet/payments;

document.getElementById("netMonthly").textContent=
euro(monthlyNet);

document.getElementById("netAnnual").textContent=
euro(annualNet);

document.getElementById("netIrpf").textContent=
euro(annualIrpf);

document.getElementById("netSocial").textContent=
euro(annualSocial);

}


/* =====================================================
   PRESUPUESTO MENSUAL
===================================================== */

function calculateBudget(){

const income=num("budgetIncome");

const housing=num("budgetHousing");
const utilities=num("budgetUtilities");
const food=num("budgetFood");
const transport=num("budgetTransport");
const leisure=num("budgetLeisure");
const other=num("budgetOther");

if(income<=0){

alert("Introduce tus ingresos.");

return;

}

const expenses=
housing+
utilities+
food+
transport+
leisure+
other;

const remaining=
income-expenses;

const savingRate=
remaining/income*100;

document.getElementById("budgetExpenses").textContent=
euro(expenses);

document.getElementById("budgetRemaining").textContent=
euro(remaining);

document.getElementById("budgetSavingRate").textContent=
pct(savingRate);

if(remaining>=0){

document.getElementById("budgetStatus").innerHTML=
'<div class="success">Después de los gastos introducidos quedarían aproximadamente '+euro(remaining)+' al mes.</div>';

}else{

document.getElementById("budgetStatus").innerHTML=
'<div class="warning">Tus gastos superan los ingresos en aproximadamente '+euro(Math.abs(remaining))+' al mes.</div>';

}

}


/* =====================================================
   AMORTIZACIÓN HIPOTECA
===================================================== */

function calculateAmortization(){

const loan=num("amLoan");
const rate=num("amRate");
const years=num("amYears");
const extra=num("amExtra");

if(loan<=0 || years<=0){

alert("Introduce valores válidos.");

return;

}

const originalPayment=
mortgagePayment(
loan,
rate,
years
);

const months=years*12;

const totalOriginal=
originalPayment*months;

const originalInterest=
totalOriginal-loan;

const newLoan=
Math.max(0,loan-extra);

const newPayment=
mortgagePayment(
newLoan,
rate,
years
);

const newTotal=
newPayment*months;

const newInterest=
newTotal-newLoan;

const interestSaving=
Math.max(
0,
originalInterest-newInterest
);

document.getElementById("amOriginalPayment").textContent=
euro(originalPayment)+"/mes";

document.getElementById("amNewPayment").textContent=
euro(newPayment)+"/mes";

document.getElementById("amOriginalInterest").textContent=
euro(originalInterest);

document.getElementById("amNewInterest").textContent=
euro(newInterest);

document.getElementById("amSaving").textContent=
euro(interestSaving);

}


/* =====================================================
   INTERÉS COMPUESTO
===================================================== */

function calculateCompound(){

const initial=num("compoundInitial");
const monthly=num("compoundMonthly");
const rate=num("compoundRate");
const years=num("compoundYears");

if(initial<0 || monthly<0 || years<=0){

alert("Introduce valores válidos.");

return;

}

const months=years*12;

const monthlyRate=rate/100/12;

let finalValue;

if(monthlyRate===0){

finalValue=
initial+
monthly*months;

}else{

finalValue=
initial*Math.pow(
1+monthlyRate,
months
)
+
monthly*
(
(Math.pow(1+monthlyRate,months)-1)/
monthlyRate
);

}

const contributions=
initial+
monthly*months;

const profit=
finalValue-contributions;

document.getElementById("compoundFinal").textContent=
euro(finalValue);

document.getElementById("compoundContributions").textContent=
euro(contributions);

document.getElementById("compoundProfit").textContent=
euro(profit);

}


/* =====================================================
   OBJETIVO FINANCIERO
===================================================== */

function calculateGoal(){

const target=num("goalTarget");
const current=num("goalCurrent");
const monthly=num("goalMonthly");
const rate=num("goalRate");

if(target<=0 || monthly<=0){

alert("Introduce valores válidos.");

return;

}

let balance=current;
let months=0;

const monthlyRate=rate/100/12;

while(balance<target && months<1200){

balance=
balance*(1+monthlyRate)+monthly;

months++;

}

if(months>=1200){

document.getElementById("goalTime").textContent=
"No alcanzado con estos supuestos";

return;

}

const years=
Math.floor(months/12);

const rest=
months%12;

let text="";

if(years>0){

text+=years+(years===1?" año":" años");

}

if(rest>0){

if(text) text+=" y ";

text+=rest+(rest===1?" mes":" meses");

}

document.getElementById("goalTime").textContent=
text;

document.getElementById("goalFinal").textContent=
euro(balance);

}


/* =====================================================
   INICIALIZAR
===================================================== */

calculateMortgage();
calculateAffordability();
calculateHouseSavings();
calculateBuyRent();
calculateLoans();
calculateNetSalary();
calculateBudget();
calculateAmortization();
calculateCompound();
